# ==========================================
# KeyVaultJS - cabeceras de seguridad (H-08)
# ==========================================
# Se incluye en el server y en CADA location que declare su propio add_header:
# nginx NO hereda las cabeceras del bloque padre en cuanto un hijo añade una
# suya, así que sin este include algunas rutas se quedarían sin CSP.
#
# CSP estricta: sin orígenes externos, sin 'unsafe-inline'. Es viable porque ya
# no hay CDN (H-07) ni scripts/estilos inline en index.html.
# HSTS lo emite Apache, que es quien termina TLS (ver deploy/apache/).
#
# `always` para que también se emitan en respuestas de error (4xx/5xx).
# ==========================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
