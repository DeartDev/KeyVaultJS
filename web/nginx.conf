# ==========================================
# KeyVaultJS - nginx (estáticos + proxy a la API)
# ==========================================

# H-04 (capa 1): límite de peticiones a /api/auth/ por IP, antes de que lleguen
# a Node. Frena el diccionario y, sobre todo, impide encadenar hashes bcrypt
# (coste 12) para agotar la CPU del host. La segunda capa está en Express.
# Este archivo se incluye dentro del contexto http, así que limit_req_zone es válido aquí.
limit_req_zone $binary_remote_addr zone=keyvault_auth:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El blob del vault es pequeño; se deja margen para crecer.
    client_max_body_size 2m;

    include /etc/nginx/keyvault/security-headers.conf;

    # SPA fallback: sirve index.html para rutas desconocidas.
    # `no-cache` = revalidar siempre (barato con ETag). Sin esto el navegador
    # aplica heurísticas y puede seguir sirviendo el shell viejo tras desplegar.
    location / {
        include /etc/nginx/keyvault/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Igual que el shell: el manifest cambia entre versiones y no lleva hash.
    location = /manifest.json {
        include /etc/nginx/keyvault/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Autenticación: bloque más específico que /api/, se evalúa primero.
    location /api/auth/ {
        limit_req zone=keyvault_auth burst=10 nodelay;
        include /etc/nginx/keyvault/proxy.conf;
    }

    # Resto de la API (mismo origen -> sin CORS).
    location /api/ {
        include /etc/nginx/keyvault/proxy.conf;
    }

    # El service worker nunca se cachea: si no, un despliegue nuevo puede
    # quedar "atrapado" detrás de un SW viejo.
    location = /service-worker.js {
        include /etc/nginx/keyvault/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Caché para assets estáticos. Sin `immutable`: los nombres no llevan hash,
    # así que el navegador debe poder revalidarlos tras un despliegue.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        include /etc/nginx/keyvault/security-headers.conf;
        # `expires` ya emite Cache-Control y Expires; añadir otro add_header
        # Cache-Control duplicaría la cabecera. Sin `immutable`: los nombres de
        # archivo no llevan hash, así que el navegador debe poder revalidarlos.
        expires 1h;
    }
}
