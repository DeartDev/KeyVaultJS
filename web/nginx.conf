server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Max body size: vault blob is small, but keep headroom.
    client_max_body_size 2m;

    # SPA fallback: serve index.html for unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the API container (same origin -> no CORS needed).
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Never cache the service worker.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Long cache for hashed/static assets (none today, ready for future bundler).
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
