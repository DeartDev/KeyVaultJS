# ==========================================
# KeyVaultJS - docker-compose (local + server)
# Run from /var/www/keyvaultjs:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
# ==========================================

services:
  db:
    image: postgres:16-alpine
    container_name: keyvault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-keyvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-keyvault}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyvault} -d ${POSTGRES_DB:-keyvault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keyvault_net

  api:
    build:
      context: ../api
    container_name: keyvault_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:           ${NODE_ENV:-production}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      DATABASE_URL:       postgres://${POSTGRES_USER:-keyvault}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-keyvault}
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL:     ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL:    ${JWT_REFRESH_TTL:-7d}
      BCRYPT_ROUNDS:      ${BCRYPT_ROUNDS:-12}
      VAULT_MAX_BYTES:    ${VAULT_MAX_BYTES:-1048576}
      PORT:               "3000"
    # Internal port only: not published to host.
    expose:
      - "3000"
    networks:
      - keyvault_net

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: keyvault_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8084:80"
    networks:
      - keyvault_net

volumes:
  pgdata:
    name: keyvault_pgdata

networks:
  keyvault_net:
    name: keyvault_net
    driver: bridge
