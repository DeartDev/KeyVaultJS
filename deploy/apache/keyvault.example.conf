# ==========================================
# KeyVaultJS - Apache vhost template
# ==========================================
# Variables substituted by deploy/apache/setup-apache.sh:
#   ${DOMAIN}  -> ServerName
#
# Base HTTP. Certbot añade el vhost :443 automáticamente y aplica la
# redirección a HTTPS cuando se invoca con --redirect.
#
# El contenedor web solo escucha en 127.0.0.1:8084 (docker-compose.prod.yml),
# así que Apache es el único punto de entrada público.
# ==========================================

<VirtualHost *:80>
    ServerName ${DOMAIN}
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/

    <Location />
        Require all granted
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/keyvault_error.log
    CustomLog ${APACHE_LOG_DIR}/keyvault_access.log combined
</VirtualHost>

# ==========================================
# HSTS (H-08)
# ==========================================
# Solo tiene sentido en el vhost TLS: obliga al navegador a usar HTTPS durante
# max-age. Se emite aquí, y no en nginx, porque Apache es quien termina TLS.
#
# ATENCIÓN: activar HSTS es difícil de revertir (el navegador lo recuerda
# durante max-age). Habilítalo solo cuando el certificado esté emitido y HTTPS
# funcione de forma estable. `preload` requiere además dar de alta el dominio
# en https://hstspreload.org y solo debe usarse si TODOS los subdominios van
# por HTTPS.
#
# setup-apache.sh inserta este bloque en el vhost :443 tras ejecutar certbot.
#
# <IfModule mod_headers.c>
#     Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
# </IfModule>
