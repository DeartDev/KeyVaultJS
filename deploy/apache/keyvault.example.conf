# ==========================================
# KeyVaultJS - Apache vhost template
# ==========================================
# Variables substituted by deploy/apache/setup-apache.sh:
#   ${DOMAIN}  -> ServerName
#
# This is the HTTP-only base. Certbot will append the :443 vhost automatically
# and apply the HTTPS redirect when invoked with --redirect.
# ==========================================

<VirtualHost *:80>
    ServerName ${DOMAIN}
    ServerAdmin webmaster@localhost

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/

    # Allow larger vault uploads through the proxy.
    <Location />
        Require all granted
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/keyvault_error.log
    CustomLog ${APACHE_LOG_DIR}/keyvault_access.log combined
</VirtualHost>
